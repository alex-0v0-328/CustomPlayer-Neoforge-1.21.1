modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="Alex"
description='''
Splits the player into addressable body parts -- head, eyes, ears, mouth, nose, torso and four limbs --
each able to carry injuries, path marks and an installed item.

A library mod. It defines the body and nothing else: what a mark MEANS, and which items may be installed,
are decided by the mods that depend on it.
'''

# The mixins config exists but is deliberately NOT declared: nothing needs a mixin yet, and an inert
# config that FML never loads cannot break a launch. Add this block the day a real need appears.
#[[mixins]]
#config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
